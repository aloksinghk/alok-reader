<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Alok Reader — personal Kindle-style PDF reader">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Alok Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19.5C4 18.12 5.12 17 6.5 17H20V4H6.5C5.12 4 4 5.12 4 6.5V19.5Z" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M6.5 4H20V17H6.5C5.12 17 4 18.12 4 19.5V6.5C4 5.12 5.12 4 6.5 4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12 4V12.5L14.5 11L17 12.5V4" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="8" cy="8" r="1" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>Alok Reader</strong>
        <span>Your private library</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Library</div>
      <button class="nav-item active" data-screen="library">
        <span class="nav-icon">⌂</span> Home
      </button>
      <button class="nav-item" data-screen="collections">
        <span class="nav-icon">▦</span> Collections
      </button>

      <div class="nav-label" style="margin-top:16px">Reading</div>
      <button class="nav-item" data-screen="bookmarks">
        <span class="nav-icon">🔖</span> Bookmarks
      </button>
      <button class="nav-item" data-screen="highlights">
        <span class="nav-icon">🖊</span> Highlights
      </button>

      <div class="nav-label" style="margin-top:16px">Manage</div>
      <label class="nav-item upload-nav" for="fileInput">
        <span class="nav-icon">＋</span> Add Books
      </label>
      <button class="nav-item" data-screen="upload">
        <span class="nav-icon">⚙</span> Settings &amp; Backup
      </button>
    </div>

    <div class="sidebar-footer">
      <small>Alok Reader v3.3</small>
      <small>Local-first · No accounts needed</small>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="topbar-btn mobile-only" aria-label="Open menu">☰</button>
      <div class="top-title" id="topTitle">Home</div>
      <div class="top-actions">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="globalSearch" class="search" placeholder="Search your library…" aria-label="Search library">
        </div>
        <div class="theme-dropdown-wrap" id="appThemeWrap">
          <button id="appThemeBtn" class="topbar-btn theme-btn" title="Library Theme" aria-label="Change Library Theme">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2z"/>
            </svg>
            <span class="theme-btn-label">Theme</span>
          </button>
          <div id="appThemePopover" class="app-theme-popover hidden">
            <div class="app-theme-header">Library Style</div>
            <div class="app-theme-list">
              <button class="app-theme-option" data-app-theme="binding">
                <span class="theme-preview-chip binding"></span>
                <div class="app-theme-meta">
                  <strong>Antique Binding</strong>
                  <small>Leather, gold foil &amp; parchment</small>
                </div>
              </button>
              <button class="app-theme-option" data-app-theme="cream">
                <span class="theme-preview-chip cream"></span>
                <div class="app-theme-meta">
                  <strong>Warm Cream</strong>
                  <small>Modern daylight amber &amp; cream</small>
                </div>
              </button>
              <button class="app-theme-option" data-app-theme="midnight">
                <span class="theme-preview-chip midnight"></span>
                <div class="app-theme-meta">
                  <strong>Midnight Library</strong>
                  <small>Dark academia &amp; navy gold</small>
                </div>
              </button>
              <button class="app-theme-option" data-app-theme="forest">
                <span class="theme-preview-chip forest"></span>
                <div class="app-theme-meta">
                  <strong>Forest Study</strong>
                  <small>Botanical emerald &amp; dark oak</small>
                </div>
              </button>
              <button class="app-theme-option" data-app-theme="nordic">
                <span class="theme-preview-chip nordic"></span>
                <div class="app-theme-meta">
                  <strong>Nordic Slate</strong>
                  <small>Arctic slate &amp; frost blue</small>
                </div>
              </button>
              <button class="app-theme-option" data-app-theme="obsidian">
                <span class="theme-preview-chip obsidian"></span>
                <div class="app-theme-meta">
                  <strong>Obsidian OLED</strong>
                  <small>Minimalist pure black &amp; silver</small>
                </div>
              </button>
            </div>
          </div>
        </div>
        <button class="avatar" title="Personal Library" aria-label="Library Profile">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </button>
      </div>
    </header>
    <section id="content" class="content" aria-live="polite"></section>
  </main>
</div>

<!-- ══════════════════════════════════════════════
     READER OVERLAY
══════════════════════════════════════════════ -->
<div id="reader" class="reader hidden" role="main" aria-label="Book reader">

  <!-- Top bar -->
  <header class="reader-top">
    <button id="readerClose"   class="reader-icon" title="Back (Esc)" aria-label="Close reader">←</button>
    <div class="reader-book-title" id="readerBookTitle"></div>
    <div class="reader-top-right">
      <button id="readerContentsBtn"  class="reader-icon" title="Contents (t)"  aria-label="Table of contents">☰</button>
      <button id="readerBookmarksBtn" class="reader-icon" title="Bookmarks"     aria-label="Bookmarks">🔖</button>
      <button id="readerBookmarkBtn"  class="reader-icon reader-bookmark" title="Bookmark (b)" aria-label="Bookmark page">☆</button>
      <button id="readerSearchBtn"    class="reader-icon" title="Search (f)"    aria-label="Search">⌕</button>
      <button id="readerAa"           class="reader-icon" title="Settings"      aria-label="Reading settings">Aa</button>
      <button id="readerOriginal"     class="reader-icon" title="Original PDF"  aria-label="View original PDF">PDF</button>
    </div>
  </header>

  <!-- Slide-in panels -->
  <aside id="readerContents"  class="reader-contents hidden" aria-label="Table of contents"></aside>
  <aside id="readerBookmarks" class="reader-contents hidden" aria-label="Bookmarks"></aside>

  <!-- Dynamic selection / highlight / dictionary menu -->
  <div id="selectionMenu" class="selection-menu hidden" role="menu" aria-label="Text actions"></div>

  <!-- Search bar -->
  <div id="readerSearch" class="reader-search hidden">
    <input id="readerSearchInput" placeholder="Search in this book…" aria-label="Search in book">
    <span id="readerSearchCount" aria-live="polite"></span>
  </div>

  <!-- Reading area -->
  <main class="reading-shell" aria-label="Reading area">
    <article id="readingText" class="reading-text serif" aria-live="polite"></article>
  </main>

  <!-- Bottom bar -->
  <footer class="reader-bottom">
    <button id="prevReaderPage" class="reader-bottom-btn" title="Previous page (←)" aria-label="Previous page">‹</button>
    <div class="progress-label" id="readerProgressLabel" aria-live="polite">Page 1 / 1</div>
    <input id="readerProgress" type="range" min="0" max="100" value="0" aria-label="Reading progress">
    <button id="nextReaderPage" class="reader-bottom-btn" title="Next page (→)" aria-label="Next page">›</button>
    <button id="bookmarkBtn"  class="reader-bottom-btn" aria-label="Bookmark">🔖</button>
    <button id="settingsBtn"  class="reader-bottom-btn" aria-label="Settings">Aa</button>
  </footer>

  <!-- Settings popover -->
  <div id="readingSettings" class="settings-popover hidden" role="dialog" aria-label="Reading settings">
    <div class="settings-header">
      <strong class="reading-settings-title">Reading settings</strong>
      <button id="closeSettings" aria-label="Close">×</button>
    </div>

    <div class="setting-group">
      <label>Font family</label>
      <div class="choice-row font-grid" id="fontChoices">
        <button data-font="serif">Serif</button>
        <button data-font="book">Book</button>
        <button data-font="warm">Warm</button>
        <button data-font="sans">Sans</button>
        <button data-font="mono">Mono</button>
        <button data-font="hand">✍ Hand</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Text size</label>
      <div class="choice-row">
        <button id="fontDown" aria-label="Decrease font size">A−</button>
        <span id="fontSizeValue" style="color:#94a3b8;font-size:13px;padding:0 4px">19px</span>
        <button id="fontUp" aria-label="Increase font size">A+</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Theme</label>
      <div class="choice-row theme-grid" id="themeChoices">
        <button data-theme="light"><span class="theme-dot" style="background:#FAFAF5;border:1px solid #D5D5D0"></span>Light</button>
        <button data-theme="paper"><span class="theme-dot" style="background:#F8F1E3;border:1px solid #DFD2BC"></span>Paper</button>
        <button data-theme="sepia"><span class="theme-dot" style="background:#F3E6C8"></span>Sepia</button>
        <button data-theme="solarized"><span class="theme-dot" style="background:#FDF6E3;border:1px solid #E8DCC0"></span>Solarized</button>
        <button data-theme="nord"><span class="theme-dot" style="background:#2E3440"></span>Nord</button>
        <button data-theme="dark"><span class="theme-dot" style="background:#1C1C2E"></span>Dark</button>
        <button data-theme="rose"><span class="theme-dot" style="background:#191724"></span>Rosé</button>
        <button data-theme="forest"><span class="theme-dot" style="background:#182618"></span>Forest</button>
        <button data-theme="black"><span class="theme-dot" style="background:#000000;border:1px solid #555"></span>Black</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Line spacing</label>
      <div class="choice-row" id="lineChoices">
        <button data-line="1.35">Compact</button>
        <button data-line="1.6">Normal</button>
        <button data-line="1.9">Spacious</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Layout</label>
      <div class="choice-row" id="layoutChoices">
        <button data-layout="single">Single</button>
        <button data-layout="spread">Two-page</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Text width</label>
      <div class="choice-row" id="widthChoices">
        <button data-width="660">Narrow</button>
        <button data-width="820">Normal</button>
        <button data-width="1020">Wide</button>
      </div>
    </div>

    <div class="setting-group">
      <label style="text-transform:none;letter-spacing:0;color:#334155">
        Press <kbd>?</kbd> for all keyboard shortcuts
      </label>
    </div>
  </div>
</div>

<!-- PDF viewer -->
<div id="pdfViewer" class="reader hidden" aria-label="Original PDF viewer">
  <header class="reader-top">
    <button id="pdfClose" class="reader-icon" aria-label="Close PDF viewer">←</button>
    <div class="reader-book-title">Original PDF</div>
  </header>
  <div class="pdf-frame-wrap">
    <iframe id="pdfFrame" title="Original PDF" sandbox="allow-same-origin allow-scripts"></iframe>
  </div>
</div>

<!-- File inputs -->
<input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden aria-hidden="true">

<script type="module" src="app.js?v=3.3.0"></script>
</body>
</html>
